name: Step CI Action
author: Step CI
description: Run Step CI workflows
branding:
  icon: check-circle
  color: white
inputs:
  workflow:
    description: 'Workflow Path'
    required: true
    default: '.stepci/workflows/workflow.yml'
  envs:
    description: 'Environment values as a JSON object/array, or quoted key=value entries'
    required: false
  secrets:
    description: 'Secrets as a JSON object/array, or quoted key=value entries'
    required: false
  verbose:
    description: 'verbose option. e.g "true"'
    required: false
  loadtest:
    description: 'load-test option. e.g "true"'
    required: false
  concurrency:
    description: 'concurrency option. e.g. "0"'
    required: false

runs:
  using: 'docker'
  image: 'Dockerfile.action'
  env:
    ENV: ${{ inputs.envs }}
    SECRETS: ${{ inputs.secrets }}
    VERBOSE: ${{ inputs.verbose }}
    LOADTEST: ${{ inputs.loadtest }}
    CONCURRENCY: ${{ inputs.concurrency }}
  args:
    - ${{ inputs.workflow }}
